name: Desktop

# The Rust side: the shared core, the desktop engine and the app. Formatting, lints and tests on every OS the app ships
# for, the engine against the E2E fixture servers, and the real app driven through tauri-driver on Linux.
# Design: docs/desktop.md.
on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Linux libraries for the app (WebKitGTK 4.1, tray)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The `vdh` binary (one-off downloads and the queue) against the extension's fixture servers; outputs are checked with
  # ffprobe and a full decode.
  engine-fixtures:
    runs-on: ubuntu-latest # the same runner (and ffmpeg) the extension's E2E fixtures are generated with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ffmpeg (fixture generation and output verification)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-fixtures-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test -p vdh-engine --locked
        env:
          VDH_REQUIRE_FIXTURES: '1'

  # The real app driven through tauri-driver and WebKitWebDriver in its own D-Bus session: downloads (checked with
  # ffprobe and a full decode), a DRM refusal, a live recording, settings, notifications, start at login, close to tray
  # and single instance (e2e/desktop.mjs).
  app-e2e:
    runs-on: ubuntu-latest # the runner (and ffmpeg) the fixtures are generated with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-core
      - name: Linux libraries, WebKitWebDriver, Xvfb and ffmpeg
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev
          librsvg2-dev libxdo-dev webkit2gtk-driver xvfb dbus ffmpeg
      - uses: actions/cache@v4
        id: driver
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-2.1.0
      - name: tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      # the window first: the app embeds it when it is compiled
      - run: npm run desktop:ui
      - run: cargo build -p vdown-helper-desktop --locked
      - run: xvfb-run -a npm run test:desktop

  # The browser link: the production extension in real Chromium and the real app, through Chrome native messaging
  # (the app registers itself with the test profile and the browser starts it through the relay). Files are checked
  # with ffprobe and a full decode (e2e/link.mjs).
  link-e2e:
    runs-on: ubuntu-latest # the runner (and ffmpeg) the fixtures are generated with
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-core
      - name: Linux libraries, Chromium, Xvfb and ffmpeg
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev xvfb dbus ffmpeg
      # the window first: the app embeds it when it is compiled
      - run: npm run desktop:ui
      - run: cargo build -p vdown-helper-desktop --locked
      # a session bus, as on a desktop (the app's single-instance lock and notifications use it)
      - run: xvfb-run -a dbus-run-session -- npm run test:link
