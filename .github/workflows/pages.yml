name: Pages

# Publishes the website (site/, built by scripts/build-site.mjs with the images in store-assets/) to GitHub Pages.
# One-time setup by the repository owner: Settings -> Pages -> Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'store-assets/**'
      - 'scripts/build-site.mjs'
      - 'scripts/lib/site.ts'
      - 'public/logo.svg'
      - 'e2e/run.mjs' # the page quotes how many end-to-end checks there are
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run site:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
