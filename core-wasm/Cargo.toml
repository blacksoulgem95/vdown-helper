[package]
name = "vdh-core-wasm"
version = "0.1.0"
description = "vdh-core compiled to WebAssembly for the extension"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vdh-core = { path = "../core" }
serde = "1"
serde-wasm-bindgen = "0.6.5"
# Must equal the wasm-bindgen CLI that generates the bindings (scripts/build-core.mjs checks).
wasm-bindgen = "=0.2.129"

[lints]
workspace = true
