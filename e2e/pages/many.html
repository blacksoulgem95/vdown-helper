<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Many images</title>
  </head>
  <body>
    <h1>Gallery with 320 images</h1>
    <script>
      for (let i = 0; i < 320; i++) {
        const img = document.createElement('img');
        img.width = 120;
        img.src = '/files/hero.png?n=' + i;
        document.body.append(img);
      }
    </script>
  </body>
</html>
