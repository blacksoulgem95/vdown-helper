<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Real player</title>
  </head>
  <body>
    <h3>A real player (hls.js or dash.js) in a frame</h3>
    <video id="v" controls muted width="320" title="Player clip"></video>
    <script>
      const kind = new URLSearchParams(location.search).get('kind');
      const video = document.getElementById('v');
      function load(src) {
        const s = document.createElement('script');
        s.src = src;
        return new Promise((resolve, reject) => {
          s.onload = resolve;
          s.onerror = reject;
          document.head.append(s);
        });
      }
      window.player = { kind, state: 'loading' };
      (async () => {
        if (kind === 'hls') {
          await load('/__lib/hls.min.js');
          const hls = new Hls();
          hls.on(Hls.Events.MANIFEST_PARSED, () => (window.player.state = 'manifest'));
          hls.on(Hls.Events.ERROR, (_e, d) => (window.player.error = d.details));
          hls.loadSource('/mse/hls/master.m3u8');
          hls.attachMedia(video);
        } else {
          await load('/__lib/dash.all.min.js');
          const p = dashjs.MediaPlayer().create();
          p.on('streamInitialized', () => (window.player.state = 'manifest'));
          p.on('error', (e) => (window.player.error = String(e.error && e.error.message)));
          p.initialize(video, '/mse/out.mpd', false);
        }
      })();
      video.addEventListener('loadedmetadata', () => (window.player.state = 'metadata'));
    </script>
  </body>
</html>
