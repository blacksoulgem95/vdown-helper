<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Player host page</title>
  </head>
  <body>
    <h1>A page whose player lives in a cross-origin frame</h1>
    <script>
      const q = new URLSearchParams(location.search);
      const f = document.createElement('iframe');
      f.src = q.get('c') + '/pages/player.html?kind=' + encodeURIComponent(q.get('kind') || 'hls');
      f.width = 360;
      f.height = 300;
      document.body.append(f);
    </script>
  </body>
</html>
