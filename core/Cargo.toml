[package]
name = "vdh-core"
version = "0.1.0"
description = "vdown-helper's pure logic, shared by the extension (wasm) and the desktop app"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
url = "2.5"
serde_json = "1"
unicode-normalization = "0.1"

[dev-dependencies]
# The golden fixtures hold JavaScript numbers; read them back exactly (the default parser can be one ulp off).
serde_json = { version = "1", features = ["float_roundtrip"] }


[lints]
workspace = true
