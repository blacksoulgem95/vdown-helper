# Rust side of vdown-helper: the shared core (compiled to wasm for the extension, used natively by the desktop app) and
# the desktop app (desktop/). Design: docs/desktop.md.
[workspace]
resolver = "3"
members = ["core", "core-wasm", "desktop/engine"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/blacksoulgem95/vdown-helper"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1

# The extension's wasm build (scripts/build-core.mjs): smallest code, no unwinding.
[profile.wasm]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = true
