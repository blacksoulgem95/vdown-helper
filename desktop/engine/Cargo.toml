[package]
name = "vdh-engine"
version = "0.1.0"
description = "vdown-helper's desktop download engine: fetching, HLS/DASH/AES-128, live recording, native ffmpeg"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "vdh"
path = "src/bin/vdh.rs"

[dependencies]
vdh-core = { path = "../../core" }
aes = "0.8"
# local time for the schedule window
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cbc = { version = "0.1", features = ["std"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
reqwest = { version = "0.13", features = ["stream"] }
# SQLite compiled in (no system library to find on any OS)
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "time", "sync", "signal"] }
tokio-util = "0.7"
url = "2.5"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
